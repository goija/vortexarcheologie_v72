<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX Omni-Bridge: Bare-Metal GPU Renderer</title>
    <style>
        body {
            background-color: #050505;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #000;
            border: 1px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            margin-bottom: 20px;
        }
        .dashboard {
            display: flex;
            gap: 40px;
            background: #111;
            padding: 20px;
            border: 1px solid #333;
            width: 560px;
        }
        .panel h3 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #555; }
        .bit-controls { display: flex; flex-direction: column-reverse; gap: 8px; }
        .bit-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .log-panel { flex-grow: 1; font-size: 12px; color: #888; }
        .log-entry { margin-bottom: 4px; }
        .highlight { color: #00e5ff; font-weight: bold; }
    </style>
</head>
<body>

    <h2>VORTEX OMNI-BRIDGE // GPU KERNEL</h2>
    <canvas id="vortexCanvas" width="600" height="600"></canvas>

    <div class="dashboard">
        <div class="panel">
            <h3>C++ Daemon Simulatie (Push)</h3>
            <div class="bit-controls" id="controls">
                </div>
        </div>
        <div class="panel log-panel">
            <h3>WebRTC DataChannel Buffer</h3>
            <div id="binaryLog">Wacht op telemetrie...</div>
        </div>
    </div>

<script>
/**
 * 1. DE SHADERS (GLSL)
 * Dit draait rechtstreeks op de videokaart.
 */
const vertexShaderSource = `#version 300 es
    // De 8-bit payloads direct van de netwerk-buffer
    uniform int u_hexagram;     
    uniform int u_xorModifier;  

    // De basisvorm van 1 lijn
    in vec2 a_position; 

    // Data voor de Fragment Shader
    out float v_isYang; 
    out vec2 v_uv;

    void main() {
        // Welke van de 6 lijnen zijn we aan het renderen? (0 t/m 5)
        int lineIndex = gl_InstanceID;

        // Binaire ontsleuteling op GPU hardware
        int lineState = (u_hexagram >> lineIndex) & 1;
        int xorState  = (u_xorModifier >> lineIndex) & 1;
        int finalState = lineState ^ xorState;

        v_isYang = float(finalState);
        v_uv = a_position; 

        // Positioneer de 6 lijnen verticaal boven elkaar
        vec2 offset = vec2(0.0, float(lineIndex) * 0.25 - 0.625);
        gl_Position = vec4(a_position + offset, 0.0, 1.0);
    }
`;

const fragmentShaderSource = `#version 300 es
    precision highp float;

    in float v_isYang;
    in vec2 v_uv;
    out vec4 fragColor;

    void main() {
        vec3 baseColor = vec3(0.0, 0.9, 1.0); // Cyber-blauw

        // Bereken de afstand tot het midden van de lijn (voor de Yin breuk)
        float distFromCenter = abs(v_uv.x);

        // De Yin-Logica: Gooi de pixels in het midden weg
        // v_uv.x loopt grofweg van -0.6 tot 0.6
        if (v_isYang < 0.5 && distFromCenter < 0.08) {
            discard; // Hardware-level kill van de pixel
        }

        // Simpel gloed-effect voor de sci-fi look
        float edgeFading = smoothstep(0.05, 0.0, abs(v_uv.y));
        fragColor = vec4(baseColor * (0.3 + 0.7 * edgeFading), 1.0);
    }
`;

/**
 * 2. WEBGL2 INITIALISATIE (DE ENGINE)
 */
const canvas = document.getElementById('vortexCanvas');
const gl = canvas.getContext('webgl2');

if (!gl) { alert('WebGL2 wordt niet ondersteund door je browser!'); }

// Compileer Shaders
function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
    }
    return shader;
}

const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
const program = gl.createProgram();
gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);

// Geometrie: We maken slechts één quad (rechthoek) die we 6 keer gaan hergebruiken.
const positions = new Float32Array([
    -0.6, -0.05,
     0.6, -0.05,
    -0.6,  0.05,
     0.6,  0.05,
]);

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

const positionLocation = gl.getAttribLocation(program, "a_position");
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

const hexagramLoc = gl.getUniformLocation(program, "u_hexagram");
const xorModifierLoc = gl.getUniformLocation(program, "u_xorModifier");

/**
 * 3. WEBRTC DATAVIEW SIMULATIE (Zero-Allocation Pipeline)
 */
let currentHexagramByte = 0b000000;

function renderVortexFrame(rawArrayBuffer) {
    // 1. Lees de binaire data met O(1) complexiteit (Geen JSON!)
    const view = new DataView(rawArrayBuffer);
    const hexByte = view.getUint8(0);
    const xorByte = view.getUint8(1);
    
    // Optioneel: Lees de 64-bit timestamp uit de buffer
    // const timestamp = view.getBigUint64(2, false);

    // 2. Render de GPU pipeline
    gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    gl.clearColor(0.02, 0.02, 0.02, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(program);

    // 3. Stuur de binaire payload naar de Shader
    gl.uniform1i(hexagramLoc, hexByte);
    gl.uniform1i(xorModifierLoc, xorByte); // Laten we op 0 in deze demo

    // 4. Instanced Rendering: Teken de quad 6 keer!
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 6);
}

/**
 * 4. UI & LOGICA (Simuleer het inkomende UDP/WebRTC verkeer)
 */
const controlsDiv = document.getElementById('controls');
const logDiv = document.getElementById('binaryLog');

// Maak 6 checkboxes voor de bits (Lijn 1 = beneden, Lijn 6 = boven)
for (let i = 0; i < 6; i++) {
    const row = document.createElement('div');
    row.className = 'bit-row';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `bit_${i}`;
    checkbox.addEventListener('change', () => simulateIncomingNetworkPacket());
    
    const label = document.createElement('label');
    label.innerText = `Lijn ${i+1} (Bit ${i})`;
    label.htmlFor = `bit_${i}`;
    
    row.appendChild(checkbox);
    row.appendChild(label);
    controlsDiv.appendChild(row);
}

// Genereer een 10-byte ArrayBuffer zoals de C++ WebRTC daemon zou sturen
function simulateIncomingNetworkPacket() {
    let newHexByte = 0;
    for (let i = 0; i < 6; i++) {
        if (document.getElementById(`bit_${i}`).checked) {
            newHexByte |= (1 << i); // Bitwise OR om de bit te zetten
        }
    }
    
    // Maak de 10-byte SCTP payload
    const sctpBuffer = new ArrayBuffer(10);
    const view = new DataView(sctpBuffer);
    
    // Byte 0: Hexagram state
    view.setUint8(0, newHexByte);
    // Byte 1: XOR modifier (houden we 0 voor nu)
    view.setUint8(1, 0);
    // Byte 2-9: 64-bit Timestamp
    view.setBigUint64(2, BigInt(Date.now()), false);

    // Update de log
    logDiv.innerHTML = `
        <div class="log-entry">Ontvangen SCTP Frame: <span class="highlight">10 bytes</span></div>
        <div class="log-entry">Hexagram Byte (BIN): <span class="highlight">${newHexByte.toString(2).padStart(6, '0')}</span></div>
        <div class="log-entry">Hexagram Byte (INT): <span class="highlight">${newHexByte}</span></div>
        <div class="log-entry">Verwerkingstijd GPU: <span class="highlight">< 0.1ms</span></div>
    `;

    // Stuur direct door naar de GPU pijplijn
    renderVortexFrame(sctpBuffer);
}

// Initiële render (000000 - Allemaal Yin)
simulateIncomingNetworkPacket();

</script>
</body>
</html>
